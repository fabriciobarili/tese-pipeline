# Ingestão de voos (OpenSky Network). ICAO dos aeroportos.
# Autenticação via OAuth2 client credentials (env: OPENSKY_CLIENT_ID / OPENSKY_CLIENT_SECRET).
airports:
  - SBGR               # GRU
  - SBSP               # CGH
start_date: "2024-01-01"
end_date: "2024-12-31"
kinds:
  - arrival
  - departure
chunk_days: 7          # janela por chamada (respeita limites da API)

# Coordenadas dos ICAOs — usadas para indexação H3 (h3.latlng_to_cell)
# Fonte: ourairports.com / ICAO AIGD
icao_coords:
  SBGR:               # Guarulhos (GRU)
    latitude: -23.4356
    longitude: -46.4731
  SBSP:               # Congonhas (CGH)
    latitude: -23.6273
    longitude: -46.6566
