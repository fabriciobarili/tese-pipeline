# Configuração científica central da pipeline.
# TODA aleatoriedade e todo hiperparâmetro vivem aqui ou em config/*.yaml.
# Nada de constantes mágicas no código.

seed: 42

meteo:
  provider: open-meteo
  variables:
    - temperature_2m
    - precipitation
    - wind_speed_10m
    - weather_code
    - relative_humidity_2m
  # período, locais e timezone em config/meteo.yaml

flights:
  provider: anac_vra
  # aeroporto, URLs e filtros em config/flights.yaml

synthesis:
  # parâmetros do processo gerador em config/synthesis.yaml
  n_rides: 50000

geospatial:
  h3_resolution: 8          # resolução padrão (~0.74 km²; bairro/zona de demanda)
  h3_macro_resolution: 7    # resolução macro (~5.16 km²; feature de zona ampla)
  max_destination_k: 5      # raio máximo para destinos sintéticos (saltos H3)

model:
  target: duration_min          # alvo da regressão (ajuste à hipótese da tese)
  cv_folds: 5
  split: temporal               # NUNCA aleatório para dados dependentes do tempo
  test_frac: 0.2
  optuna:
    n_trials: 100
    timeout_s: 3600
    direction: minimize
    metric: rmse

# Engenharia de features aplicada em make_xy (lógica do 05_6_FeatureEng_...). Backward-looking
# (sem vazamento do futuro). climate_cols lista só o que existe em rides.parquet.
feature_eng:
  enabled: true
  time_col: ts_hour
  climate_cols: [temperature_2m, wind_speed_10m]   # relative_humidity/precip/pressure ausentes
  horizontes: ["3h", "6h", "24h"]                  # médias móveis por tempo
  ciclicas: {hour: 24, dow: 7, month: 12}          # codificação sin/cos

explain:
  shap_sample: 2000
  top_features: 20
